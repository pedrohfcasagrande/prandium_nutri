services:
  mysql:
    image: mysql:8.4
    container_name: nutri-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nutritracker
      MYSQL_USER: nutri
      MYSQL_PASSWORD: nutri
    ports:
      - "3307:3306"
    volumes:
      - nutri_mysql_dev:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  nutri_mysql_dev:
