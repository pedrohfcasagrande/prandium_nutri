spring:
  application:
    name: nutri-tracker
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # Importa application-local.yml se existir (git-ignored, para secrets locais)
  config:
    import: optional:classpath:application-local.yml

server:
  port: ${SERVER_PORT:8080}

# Config compartilhada (defaults). Cada perfil sobrescreve o que precisa.
nutritracker:
  ai:
    provider: ${AI_PROVIDER:gemini}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-flash-lite-latest}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost}
  jwt:
    secret: ${JWT_SECRET:change-me-please-change-me-please-change-me-please-32b}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  admin:
    email: ${ADMIN_EMAIL:admin@admin.com}
    password: ${ADMIN_PASSWORD:admin@123}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@nutritracker.local}
  reset:
    expiration-hours: ${RESET_EXPIRATION_HOURS:1}
    frontend-url: ${FRONTEND_URL:http://localhost:4200}
  invite:
    expiration-days: ${INVITE_EXPIRATION_DAYS:14}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  mercadopago:
    access-token: ${MP_ACCESS_TOKEN:}
    webhook-secret: ${MP_WEBHOOK_SECRET:}
  checkout:
    success-url: ${CHECKOUT_SUCCESS_URL:http://localhost:4200/billing?checkout=success}
    cancel-url: ${CHECKOUT_CANCEL_URL:http://localhost:4200/pricing?checkout=canceled}

---
# --------------------------------------------------------------------
# Perfil DEV: local development
#   - MySQL local via docker-compose.dev.yml (porta 3307)
#   - Pagamentos MOCK (nenhuma cobranca real, subscriptions ativadas na hora)
#   - Emails apenas logados no console (MAIL_ENABLED=false)
#   - IA: Gemini (configurar GEMINI_API_KEY para funcionar de verdade)
# --------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:nutritracker}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USER:nutri}
    password: ${DB_PASS:nutri}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true

---
# --------------------------------------------------------------------
# Perfil SANDBOX: staging / testes reais
#   - MySQL sandbox (host/credencial via env)
#   - Pagamentos REAIS mas em ambiente de TESTE (Stripe test keys, MP test tokens)
#   - Emails via SMTP (MAIL_ENABLED=true, configurar spring.mail.*)
#   - Ideal para QA e demos com clientes
# --------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: sandbox
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:nutritracker_sandbox}?useSSL=true&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true

---
# --------------------------------------------------------------------
# Perfil PROD: producao
#   - MySQL prod (host/credencial via env; SSL habilitado)
#   - Pagamentos REAIS produção (chaves live)
#   - Emails via SMTP producao
#   - Requer todas as env vars configuradas
# --------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:nutritracker}?useSSL=true&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true

---
# --------------------------------------------------------------------
# Perfil TEST: usado pelos JUnit / Spring tests. H2 em memoria.
# --------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:nutritracker-test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
